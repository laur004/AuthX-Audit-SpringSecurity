<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>Tickets Page</title>
    </head>
    <body>
        <a th:href="@{/dashboard}">Back</a>
        <h1>Tickets Page</h1>
        <a th:href="@{/create-ticket}" >Create ticket</a>

        <br />
        <br />
        <form th:action="@{/tickets}" method="get">
            <input type="text" name="query" th:value="${query}" placeholder="Search tickets..." />
            <button type="submit">Search</button>
        </form>
        <br />


        <ul style="list-style: none;">
            <li  th:each="ticket: ${tickets}" >
                <div style="border: 1px solid black;">
                    <span th:text="|${ticket.getTitle()} - ${ticket.getSeverityLevel().name()} - ${ticket.getStatus()}, created at ${ticket.createdAt.toString()}, last update at ${ticket.updatedAt.toString()}|"></span>
                    <p th:if="${showOwner}" th:text="|Owner: ${ticket.getOwner().getEmail()}|"></p>
                    <a th:href="@{/edit-ticket/{ticketId}(ticketId=${ticket.getId()})}">Edit ticket</a>
                </div>
                <br />
            </li>
        </ul>

    </body>
</html>
